services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoresist}
      POSTGRES_USER: ${POSTGRES_USER:-ecoresist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoresist} -d ${POSTGRES_DB:-ecoresist}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
